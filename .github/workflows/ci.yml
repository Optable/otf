name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
      - name: Check no diff
        run: make check-no-diff
      - name: Lint check
        run: |
          make lint
          make helm-lint
      - name: Vet check
        run: make vet
  test:
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
      - name: Install e2e dependencies
        run: make install-playwright-ubuntu
      # tofu and kind are installed from release binaries: their setup actions
      # are not on the org's allowed actions list.
      - name: Install tofu for provider mirror setup
        env:
          TOFU_VERSION: 1.13.1
          TOFU_SHA256: 8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80
        run: |
          curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  /tmp/tofu.zip" | sha256sum -c -
          sudo unzip -o /tmp/tofu.zip tofu -d /usr/local/bin
      - name: Install terraform for provider mirror setup
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Setup provider mirror for integration tests
        run: ./hack/setup_mirror.sh
      - name: Create kind cluster for integration tests
        env:
          KIND_VERSION: 0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind create cluster --name kind --wait 5m
      - name: Tests
        env:
          OTF_TEST_KUBE: true
        run: make test
      - name: Archive browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-browser-traces
          path: internal/integration/traces
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
      - name: Add hosts to /etc/hosts
        run: |
          # otfd is configured with hostname otf.local
          echo "127.0.0.1 otf.local" | sudo tee -a /etc/hosts
      - name: API tests
        # VCS tests are skipped: they need a github oauth token to create a
        # webhook on a real github repo.
        run: make go-tfe-tests
